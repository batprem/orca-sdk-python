[project]
name = "orca-sdk"
version = "0.1.0"
description = "Typed Python SDK (sync and asyncio) for the Orca CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Prem" }]
keywords = ["orca", "cli", "sdk", "agents", "worktrees"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/orca_sdk", "scripts", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: runs against the real orca binary (set ORCA_INTEGRATION=1)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/orca_sdk/_generated.py"]
